---
# usage: hydra/launcher=slurm_dipc

defaults:
  - submitit_slurm

partition: general
qos: regular
name: hydra-example
cpus_per_task: 8
nodes: 1
tasks_per_node: 1
timeout_min: 600  # 10 hours
mem_gb: 96
gres: "gpu:1"
constraint: a100-pcie

setup:
  - "export WANDB_API_KEY=wandb_v1_"
  - "export HF_HOME=/scratch/tkehrenberg/huggingface"
  - "source .venv/bin/activate"
